<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Snake</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #080811;
      color: #e0f7fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    h1 {
      font-size: 2.5rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #00ffcc;
      text-shadow: 0 0 10px #00ffcc, 0 0 25px rgba(0, 255, 204, 0.6);
      margin-bottom: 12px;
    }

    .scoreboard {
      display: flex;
      gap: 30px;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .score-box {
      background: rgba(13, 17, 34, 0.85);
      border: 1px solid #1a2744;
      border-radius: 8px;
      padding: 6px 18px;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.15);
    }

    .score-value {
      color: #ff007f;
      text-shadow: 0 0 8px #ff007f;
      margin-left: 6px;
    }

    .game-container {
      position: relative;
      border: 3px solid #00ffcc;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.45), inset 0 0 20px rgba(0, 255, 204, 0.1);
      background: #0d1122;
      overflow: hidden;
    }

    canvas {
      display: block;
      background-color: #0b0f1d;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(8, 8, 17, 0.85);
      backdrop-filter: blur(4px);
      transition: opacity 0.25s ease;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay-title {
      font-size: 2rem;
      color: #ff007f;
      text-shadow: 0 0 12px #ff007f, 0 0 24px rgba(255, 0, 127, 0.5);
      margin-bottom: 15px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .overlay-prompt {
      font-size: 1.1rem;
      color: #00ffcc;
      text-shadow: 0 0 8px #00ffcc;
      animation: pulse 1.5s infinite alternate;
    }

    .instructions {
      margin-top: 15px;
      font-size: 0.85rem;
      color: #64748b;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    @keyframes pulse {
      from {
        opacity: 0.6;
        transform: scale(0.98);
      }
      to {
        opacity: 1;
        transform: scale(1.02);
      }
    }
  </style>
</head>
<body>
  <h1>Neon Snake</h1>
  <div class="scoreboard">
    <div class="score-box">Score: <span id="score" class="score-value">0</span></div>
    <div class="score-box">High Score: <span id="high-score" class="score-value">0</span></div>
  </div>

  <div class="game-container">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="overlay" class="overlay">
      <div id="overlay-title" class="overlay-title">Ready?</div>
      <div class="overlay-prompt">Press SPACE to Start</div>
    </div>
  </div>

  <div class="instructions">Use Arrow Keys or WASD to navigate</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const highScoreElement = document.getElementById('high-score');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');

    const GRID_SIZE = 20;
    const TILE_COUNT = canvas.width / GRID_SIZE;
    const GAME_SPEED = 100;

    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(frequency, type, duration, gainStart = 0.15, gainEnd = 0.001) {
      try {
        const ctxAudio = getAudioContext();
        const osc = ctxAudio.createOscillator();
        const gainNode = ctxAudio.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(frequency, ctxAudio.currentTime);

        gainNode.gain.setValueAtTime(gainStart, ctxAudio.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(gainEnd, ctxAudio.currentTime + duration);

        osc.connect(gainNode);
        gainNode.connect(ctxAudio.destination);

        osc.start();
        osc.stop(ctxAudio.currentTime + duration);
      } catch (e) {
        // Audio policy or unsupported context handling
      }
    }

    function playEatSound() {
      try {
        const ctxAudio = getAudioContext();
        const osc = ctxAudio.createOscillator();
        const gainNode = ctxAudio.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, ctxAudio.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctxAudio.currentTime + 0.12);

        gainNode.gain.setValueAtTime(0.2, ctxAudio.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, ctxAudio.currentTime + 0.12);

        osc.connect(gainNode);
        gainNode.connect(ctxAudio.destination);

        osc.start();
        osc.stop(ctxAudio.currentTime + 0.12);
      } catch (e) {}
    }

    function playMoveSound() {
      playTone(180, 'triangle', 0.04, 0.04);
    }

    function playGameOverSound() {
      try {
        const ctxAudio = getAudioContext();
        const osc = ctxAudio.createOscillator();
        const gainNode = ctxAudio.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(260, ctxAudio.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, ctxAudio.currentTime + 0.45);

        gainNode.gain.setValueAtTime(0.3, ctxAudio.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, ctxAudio.currentTime + 0.45);

        osc.connect(gainNode);
        gainNode.connect(ctxAudio.destination);

        osc.start();
        osc.stop(ctxAudio.currentTime + 0.45);
      } catch (e) {}
    }

    let snake = [];
    let velocity = { x: 0, y: 0 };
    let nextVelocity = { x: 0, y: 0 };
    let food = { x: 0, y: 0 };
    let score = 0;
    let highScore = localStorage.getItem('neon_snake_highscore') || 0;
    let gameInterval = null;
    let isRunning = false;

    highScoreElement.textContent = highScore;

    function resetGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 10, y: 11 },
        { x: 10, y: 12 }
      ];
      velocity = { x: 0, y: -1 };
      nextVelocity = { x: 0, y: -1 };
      score = 0;
      scoreElement.textContent = score;
      placeFood();
    }

    function placeFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * TILE_COUNT);
        food.y = Math.floor(Math.random() * TILE_COUNT);
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function startGame() {
      resetGame();
      overlay.classList.add('hidden');
      isRunning = true;
      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(gameLoop, GAME_SPEED);
    }

    function gameOver() {
      clearInterval(gameInterval);
      isRunning = false;
      playGameOverSound();

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('neon_snake_highscore', highScore);
        highScoreElement.textContent = highScore;
      }

      overlayTitle.textContent = 'Game Over';
      overlay.classList.remove('hidden');
    }

    function gameLoop() {
      velocity = { ...nextVelocity };
      const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

      // Wall collision
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        gameOver();
        return;
      }

      // Self collision
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreElement.textContent = score;
        playEatSound();
        placeFood();
      } else {
        snake.pop();
        playMoveSound();
      }

      draw();
    }

    function drawGrid() {
      ctx.strokeStyle = '#141c30';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= canvas.width; i += GRID_SIZE) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }
    }

    function draw() {
      ctx.fillStyle = '#0b0f1d';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawGrid();

      // Draw Food
      ctx.save();
      ctx.fillStyle = '#ff007f';
      ctx.shadowColor = '#ff007f';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(
        food.x * GRID_SIZE + GRID_SIZE / 2,
        food.y * GRID_SIZE + GRID_SIZE / 2,
        GRID_SIZE / 2 - 2,
        0,
        Math.PI * 2
      );
      ctx.fill();
      ctx.restore();

      // Draw Snake
      snake.forEach((segment, index) => {
        ctx.save();
        if (index === 0) {
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = '#00ffcc';
          ctx.shadowBlur = 15;
        } else {
          ctx.fillStyle = '#00ffcc';
          ctx.shadowColor = '#00ffcc';
          ctx.shadowBlur = 8;
        }

        ctx.fillRect(
          segment.x * GRID_SIZE + 1,
          segment.y * GRID_SIZE + 1,
          GRID_SIZE - 2,
          GRID_SIZE - 2
        );
        ctx.restore();
      });
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (!isRunning) {
          startGame();
        }
        return;
      }

      if (!isRunning) return;

      switch (e.code) {
        case 'ArrowUp':
        case 'KeyW':
          if (velocity.y !== 1) nextVelocity = { x: 0, y: -1 };
          e.preventDefault();
          break;
        case 'ArrowDown':
        case 'KeyS':
          if (velocity.y !== -1) nextVelocity = { x: 0, y: 1 };
          e.preventDefault();
          break;
        case 'ArrowLeft':
        case 'KeyA':
          if (velocity.x !== 1) nextVelocity = { x: -1, y: 0 };
          e.preventDefault();
          break;
        case 'ArrowRight':
        case 'KeyD':
          if (velocity.x !== -1) nextVelocity = { x: 1, y: 0 };
          e.preventDefault();
          break;
      }
    });

    drawGrid();
  </script>
</body>
</html>
